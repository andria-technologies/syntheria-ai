<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntheria AI - Studio & Digital Twin Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a0f1d', 950: '#05070c' },
                        cyan: { 400: '#22d3ee', 500: '#06b6d4' },
                        magenta: { 500: '#ec4899', 600: '#db2777' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-cyan-500/20 bg-navy-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-magenta-500 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/30">S</div>
                <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 to-magenta-500 bg-clip-text text-transparent">Syntheria AI</span>
            </div>
            
            <!-- Language Selector -->
            <div class="flex items-center space-x-3">
                <select id="langSelector" onchange="changeLanguage(this.value)" class="bg-navy-900 border border-cyan-500/30 text-cyan-400 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-cyan-400">
                    <option value="id" selected>🇮🇩 ID</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="fr">🇫🇷 FR</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-20">
        
        <!-- Navigation Tabs -->
        <div class="flex space-x-2 mb-6 border-b border-slate-800 pb-2">
            <button onclick="switchTab('studio')" id="tab-studio" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition">🎙️ Studio</button>
            <button onclick="switchTab('assistant')" id="tab-assistant" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition">🤖 AI Assistant</button>
        </div>

        <!-- TAB 1: STUDIO -->
        <section id="panel-studio" class="space-y-6">
            <div class="bg-navy-900/60 border border-cyan-500/20 rounded-2xl p-5 shadow-xl shadow-cyan-950/20">
                <h2 id="txt-studio-title" class="text-lg font-bold text-cyan-400 mb-2">Avatar & Voice Studio</h2>
                <p id="txt-studio-desc" class="text-xs text-slate-400 mb-4">Unggah foto wajah dan klon suara Anda untuk merender video avatar AI secara lokal.</p>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Upload Foto Wajah (Digital Twin)</label>
                        <input type="file" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 border border-slate-800 rounded-xl p-2 bg-navy-950/50" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Naskah Video / Teks</label>
                        <textarea rows="3" class="w-full bg-navy-950/50 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-400" placeholder="Ketik apa yang ingin dikatakan avatar Anda..."></textarea>
                    </div>
                    <button class="w-full py-3 bg-gradient-to-r from-cyan-500 to-magenta-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-cyan-500/20 hover:opacity-95 transition">Render Video Avatar</button>
                </div>
            </div>
        </section>

        <!-- TAB 2: AI ASSISTANT -->
        <section id="panel-assistant" class="hidden space-y-4">
            <div class="bg-navy-900/60 border border-magenta-500/20 rounded-2xl p-4 h-[60vh] flex flex-col justify-between shadow-xl shadow-magenta-950/20">
                <div id="chatBox" class="flex-1 overflow-y-auto space-y-3 pr-2 text-xs">
                    <div class="bg-navy-950/80 border border-slate-800 p-3 rounded-xl max-w-[85%] text-slate-300">
                        Halo! Saya asisten AI Syntheria. Ada naskah atau konsep video apa yang ingin kita buat hari ini?
                    </div>
                </div>
                <div class="flex gap-2 mt-3 pt-2 border-t border-slate-800">
                    <input id="chatInput" type="text" placeholder="Tulis instruksi ke AI..." class="flex-1 bg-navy-950/50 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-magenta-500" />
                    <button onclick="sendChatMessage()" class="bg-magenta-600 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg shadow-magenta-600/30">Kirim</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Simple Multi-language Script -->
    <script>
        const translations = {
            id: { studioTitle: "Avatar & Voice Studio", studioDesc: "Unggah foto wajah dan klon suara Anda untuk merender video avatar AI." },
            en: { studioTitle: "Avatar & Voice Studio", studioDesc: "Upload your portrait photo and cloned voice to render AI avatar videos." },
            zh: { studioTitle: "化身与语音工作室", studioDesc: "上传您的肖像照片和克隆声音以渲染 AI 化身视频。" },
            ja: { studioTitle: "アバター＆ボイススタジオ", studioDesc: "顔写真とクローン音声をアップロードして、AIアバター動画をレンダリングします。" },
            es: { studioTitle: "Estudio de Avatar y Voz", studioDesc: "Sube tu foto de retrato y voz clonada para renderizar videos de avatares de IA." },
            fr: { studioTitle: "Studio d'Avatar & Voix", studioDesc: "Téléchargez votre photo portrait et votre voix clonée pour rendre des vidéos d'avatars IA." }
        };

        function switchTab(tab) {
            if(tab === 'studio') {
                document.getElementById('panel-studio').classList.remove('hidden');
                document.getElementById('panel-assistant').classList.add('hidden');
                document.getElementById('tab-studio').className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition";
                document.getElementById('tab-assistant').className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            } else {
                document.getElementById('panel-studio').classList.add('hidden');
                document.getElementById('panel-assistant').classList.remove('hidden');
                document.getElementById('tab-assistant').className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-magenta-500/10 text-magenta-500 border border-magenta-500/30 transition";
                document.getElementById('tab-studio').className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition";
            }
        }

        function changeLanguage(lang) {
            const t = translations[lang] || translations['id'];
            document.getElementById('txt-studio-title').innerText = t.studioTitle;
            document.getElementById('txt-studio-desc').innerText = t.studioDesc;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            if(!input.value.trim()) return;
            
            chatBox.innerHTML += `<div class="bg-cyan-950/40 border border-cyan-500/30 p-3 rounded-xl max-w-[85%] ml-auto text-cyan-200">${input.value}</div>`;
            const msg = input.value;
            input.value = '';
            
            setTimeout(() => {
                chatBox.innerHTML += `<div class="bg-navy-950/80 border border-slate-800 p-3 rounded-xl max-w-[85%] text-slate-300">Syntheria AI mendeteksi instruksi: "${msg}". Menyiapkan modul asisten...</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
